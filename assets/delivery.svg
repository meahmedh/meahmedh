  <g><circle cx="288.0" cy="124" r="17" fill="#0d1219" stroke="#1b2733" stroke-width="2"/><circle cx="288.0" cy="124" r="17" fill="#77f4df" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.140;0.180;.97;1" dur="6.0s" repeatCount="indefinite"/></circle><text x="288.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#f2f6f7">2</text><text x="288.0" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f6f7">Lint + tests</text><text x="288.0" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92a0ad">own runner</text></g>
  <g><circle cx="496.0" cy="124" r="17" fill="#0d1219" stroke="#1b2733" stroke-width="2"/><circle cx="496.0" cy="124" r="17" fill="#77f4df" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.340;.97;1" dur="6.0s" repeatCount="indefinite"/></circle><text x="496.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#f2f6f7">3</text><text x="496.0" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f6f7">Docker build</text><text x="496.0" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92a0ad">ARM64 image</text></g>
  <g><circle cx="704.0" cy="124" r="17" fill="#0d1219" stroke="#1b2733" stroke-width="2"/><circle cx="704.0" cy="124" r="17" fill="#77f4df" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.460;0.500;.97;1" dur="6.0s" repeatCount="indefinite"/></circle><text x="704.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#f2f6f7">4</text><text x="704.0" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f6f7">Deploy</text><text x="704.0" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92a0ad">zero-touch</text></g>
  <g><circle cx="912.0" cy="124" r="17" fill="#0d1219" stroke="#1b2733" stroke-width="2"/><circle cx="912.0" cy="124" r="17" fill="#77f4df" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.620;0.660;.97;1" dur="6.0s" repeatCount="indefinite"/></circle><text x="912.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#f2f6f7">5</text><text x="912.0" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f6f7">Health check</text><text x="912.0" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92a0ad">API + worker</text></g>
  <g><circle cx="1120.0" cy="124" r="17" fill="#0d1219" stroke="#1b2733" stroke-width="2"/><circle cx="1120.0" cy="124" r="17" fill="#77f4df" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.780;0.820;.97;1" dur="6.0s" repeatCount="indefinite"/></circle><text x="1120.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#f2f6f7">6</text><text x="1120.0" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f6f7">Live</text><text x="1120.0" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92a0ad">behind the CDN</text></g>
