<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="How I ship: git push, lint and tests, Docker build, deploy, health check, live">
  <title>How I ship: git push, lint and tests, Docker build, deploy, health check, live</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#77f4df"/><stop offset=".55" stop-color="#69b9ff"/><stop offset="1" stop-color="#d9ff6f"/></linearGradient>
    <linearGradient id="letters" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#77f4df"/><stop offset=".55" stop-color="#69b9ff"/><stop offset="1" stop-color="#d9ff6f"/></linearGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#77f4df"/><stop offset=".55" stop-color="#69b9ff"/><stop offset="1" stop-color="#d9ff6f"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#77f4df"/><stop offset=".55" stop-color="#69b9ff"/><stop offset="1" stop-color="#d9ff6f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090d"/><stop offset=".55" stop-color="#0a1118"/><stop offset="1" stop-color="#071411"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#77f4df" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
  </defs>
  <rect width="1200" height="250" rx="22" fill="url(#bg)"/><rect width="1200" height="250" rx="22" fill="url(#grid)"/>
  <text x="40" y="46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#92a0ad"><tspan fill="#d9ff6f" font-weight="700">$</tspan> git push origin main<tspan fill="#77f4df"> ▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <line x1="80" y1="124" x2="1120" y2="124" stroke="#1b2733" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="124" x2="1120" y2="124" stroke="url(#track)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;.8;1" dur="6.0s" repeatCount="indefinite"/></line>
  <circle r="7" fill="#d9ff6f" filter="url(#glow)"><animateMotion dur="6.0s" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear" repeatCount="indefinite" path="M80 124H1120"/></circle>
