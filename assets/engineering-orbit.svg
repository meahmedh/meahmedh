<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed Hassan — Software Engineer</title>
  <desc id="desc">Animated engineering system map connecting AI, platform, product, data and cloud disciplines.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07090d"/><stop offset=".55" stop-color="#0a1118"/><stop offset="1" stop-color="#071411"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#77f4df"/><stop offset=".55" stop-color="#69b9ff"/><stop offset="1" stop-color="#d9ff6f"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#163c40"/><stop offset="1" stop-color="#0a1017"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#77f4df" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="#77f4df" stroke-opacity=".16"><ellipse cx="915" cy="180" rx="205" ry="126" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 915 180" to="360 915 180" dur="24s" repeatCount="indefinite"/></ellipse><ellipse cx="915" cy="180" rx="146" ry="88" stroke="#69b9ff" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="360 915 180" to="0 915 180" dur="17s" repeatCount="indefinite"/></ellipse></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="62" y="68" fill="#d9ff6f" font-size="13" letter-spacing="3">ENGINEERING / PRODUCTION / IMPACT</text>
    <text x="58" y="142" fill="#f2f6f7" font-family="system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-2">Ahmed Hassan</text>
    <text x="62" y="182" fill="#92a0ad" font-size="17">Senior Software Engineer · AI Systems · Cloud Platforms</text>
    <rect x="61" y="224" width="444" height="38" rx="5" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="82" cy="243" r="4" fill="#d9ff6f" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="98" y="248" fill="#77f4df" font-size="13">BUILDING RELIABLE SYSTEMS THAT SHIP</text>
    <text x="62" y="310" fill="#667581" font-size="12">PYTHON · TYPESCRIPT · LANGGRAPH · POSTGRESQL · DOCKER · KUBERNETES</text>
  </g>
  <g transform="translate(915 180)">
    <circle r="68" fill="url(#core)" stroke="url(#signal)" stroke-width="1.5"/><circle r="79" fill="none" stroke="#77f4df" stroke-opacity=".28" stroke-dasharray="48 380"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></circle>
    <text text-anchor="middle" y="-3" fill="#f2f6f7" font-family="system-ui, sans-serif" font-size="27" font-weight="800">AH</text><text text-anchor="middle" y="21" fill="#77f4df" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2">SYSTEMS ONLINE</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">
    <g transform="translate(915 32)"><rect x="-43" y="-13" width="86" height="26" rx="4" fill="#0d151c" stroke="#77f4df" stroke-opacity=".25"/><text y="4" fill="#92a0ad">AGENTIC AI</text></g>
    <g transform="translate(1113 181)"><rect x="-36" y="-13" width="72" height="26" rx="4" fill="#0d151c" stroke="#69b9ff" stroke-opacity=".25"/><text y="4" fill="#92a0ad">CLOUD</text></g>
    <g transform="translate(915 328)"><rect x="-40" y="-13" width="80" height="26" rx="4" fill="#0d151c" stroke="#d9ff6f" stroke-opacity=".25"/><text y="4" fill="#92a0ad">PLATFORM</text></g>
    <g transform="translate(718 181)"><rect x="-37" y="-13" width="74" height="26" rx="4" fill="#0d151c" stroke="#77f4df" stroke-opacity=".25"/><text y="4" fill="#92a0ad">PRODUCT</text></g>
  </g>
  <path d="M718 181H847M983 181h94M915 45v67M915 248v67" stroke="url(#signal)" stroke-opacity=".32" stroke-dasharray="4 7"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="2s" repeatCount="indefinite"/></path>
</svg>
